name: Build RK3188 Linux images

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核版本（linux-<version>.tar.xz）"
        required: false
        default: "6.12.117"
      rootfs_size_mb:
        description: "rootfs.img 大小（MB）"
        required: false
        default: "2048"
      rootfs_password:
        description: "root 登录密码"
        required: false
        default: "rockchip"
      boot_pagesize:
        description: "boot.img pagesize（引导失败可试 2048）"
        required: false
        default: "16384"
  push:
    branches: [main]
    tags: ["v*"]


permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: kernel + rootfs + boot.img
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      KERNEL_VERSION: ${{ inputs.kernel_version || '6.12.117' }}
      ROOTFS_SIZE_MB: ${{ inputs.rootfs_size_mb || '2048' }}
      ROOTFS_PASSWORD: ${{ inputs.rootfs_password || 'rockchip' }}
      BOOT_PAGESIZE: ${{ inputs.boot_pagesize || '16384' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间（内核 + rootfs 需要 8GB 以上）
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          echo "after:"; df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-arm-linux-gnueabihf libssl-dev libncurses-dev \
            bc flex bison kmod rsync cpio python3 xz-utils git curl \
            e2fsprogs dosfstools parted device-tree-compiler \
            qemu-user-static binfmt-support
          # 让 chroot 能执行 armhf 程序（rootfs 里跑 apt/dpkg 必需）
          sudo systemctl restart systemd-binfmt || true
          sudo update-binfmts --enable qemu-arm || true
          ls /proc/sys/fs/binfmt_misc/ || true
          arm-linux-gnueabihf-gcc --version

      - name: 缓存内核源码与根文件系统包
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ env.KERNEL_VERSION }}-ubuntu-base-22.04.5-armhf
          restore-keys: |
            sources-${{ env.KERNEL_VERSION }}-

      - name: 编译（内核 -> rootfs -> boot.img）
        run: |
          chmod +x build.sh scripts/*.sh
          ./build.sh all

      - name: 展示产物
        run: |
          ls -lh out/
          cat out/sha256sum.txt || true

      - name: 上传刷机文件（boot.img / rootfs.img）
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-flash-images
          path: |
            out/boot.img
            out/rootfs.img
            out/parameter.txt
            out/FLASHING-GUIDE.txt
            out/sha256sum.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: 上传调试文件（dtb / config / zImage）
        uses: actions/upload-artifact@v4
        with:
          name: rk3188-kernel-debug
          path: |
            out/zImage
            out/rk3188-adesk.dtb
            out/kernel-dtb
            out/config-${{ env.KERNEL_VERSION }}
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/boot.img
            out/rootfs.img
            out/parameter.txt
            out/FLASHING-GUIDE.txt
            out/sha256sum.txt
          body: |
            RK3188 (aDesk-STD-200H-s) Linux 刷机包
            - boot.img   -> 瑞芯微开发工具 地址 0x00002000
            - rootfs.img -> 瑞芯微开发工具 地址 0x0000A000
            - Loader / Parameter 请使用原机备份，不要用仓库里的 parameter.txt 覆盖原分区表
